AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Pipeline Binance BTCUSDT por lotes (Bronze/Silver/Gold) con Lambdas,
  Amazon S3, Glue Data Catalog, Athena y alertas.

# Empaqueta handler.py en la raíz de cada ZIP y súbelos al bucket de código:
# extract_bronze.zip, transform_silver.zip y signals_gold.zip.
# Silver requiere un layer AWSSDKPandas-Python312 que incluya pandas y pyarrow.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AlertEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Debe ser un correo válido.
  CodeBucket:
    Type: String
    Description: Bucket existente que contiene los ZIP de las Lambdas.
  CodePrefix:
    Type: String
    Default: lambda/
    Description: Prefijo de los ZIP dentro de CodeBucket.
  PandasLayerArn:
    Type: String
    AllowedPattern: "^arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:layer:[A-Za-z0-9_-]+:[0-9]+$"
    Description: ARN regional del layer AWSSDKPandas compatible con Python 3.12.
  GoldReservedConcurrency:
    Type: Number
    Default: 1
    MinValue: 0
    Description: >-
      Reserva una ejecucion Gold para evitar CTAS y limpieza concurrentes; usa 0
      si la cuenta AWS no permite reservar concurrencia.
  BudgetLimitUsd:
    Type: Number
    Default: 5
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Conditions:
  UsaConcurrenciaGold: !Not [!Equals [!Ref GoldReservedConcurrency, 0]]

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - TransformSilverInvokePermission
      - SignalsGoldInvokePermission
    Properties:
      BucketName: !Sub "binance-data-lake-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpirarResultadosAthena
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: AbortarSubidasIncompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt TransformSilverFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: "bronze/" }
                  - { Name: suffix, Value: ".json" }
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt SignalsGoldFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: "control/gold-ready/" }
                  - { Name: suffix, Value: ".json" }

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "marketmatrix_db_${Environment}"
        Description: Catálogo del pipeline de datos de Binance.

  SilverTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: binance_silver
        Description: Velas BTCUSDT validadas e indicadores en formato Parquet.
        TableType: EXTERNAL_TABLE
        PartitionKeys:
          - { Name: year, Type: int }
          - { Name: month, Type: int }
        Parameters:
          classification: parquet
          EXTERNAL: "TRUE"
          projection.enabled: "true"
          projection.year.type: integer
          projection.year.range: "2017,2040"
          projection.month.type: integer
          projection.month.range: "1,12"
          projection.month.digits: "2"
          storage.location.template: !Sub "s3://binance-data-lake-${Environment}-${AWS::AccountId}/silver/year=${!year}/month=${!month}/"
        StorageDescriptor:
          Location: !Sub "s3://binance-data-lake-${Environment}-${AWS::AccountId}/silver/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - { Name: date, Type: string }
            - { Name: symbol, Type: string }
            - { Name: open, Type: double }
            - { Name: high, Type: double }
            - { Name: low, Type: double }
            - { Name: close, Type: double }
            - { Name: volume, Type: double }
            - { Name: rsi_14, Type: double }
            - { Name: bollinger_upper, Type: double }
            - { Name: bollinger_middle, Type: double }
            - { Name: bollinger_lower, Type: double }
            - { Name: macd_line, Type: double }
            - { Name: macd_signal, Type: double }
            - { Name: macd_histogram, Type: double }

  ExtractLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/binance-extract-bronze-${Environment}"
      RetentionInDays: !Ref LogRetentionDays
  SilverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/binance-transform-silver-${Environment}"
      RetentionInDays: !Ref LogRetentionDays
  GoldLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/binance-signals-gold-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  ExtractRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BinanceExtractAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ExtractLogGroup.Arn}:*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/bronze/*"

  SilverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BinanceSilverAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${SilverLogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/bronze/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/silver/*"
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/cuarentena/*"
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/control/gold-ready/*"

  GoldRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BinanceGoldAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${GoldLogGroup.Arn}:*"
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:DeleteTable
                  - glue:UpdateTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/marketmatrix_db_${Environment}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/marketmatrix_db_${Environment}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}"
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/silver/*"
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/control/gold-ready/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/gold/*"
                  - !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}/athena-results/*"

  ExtractFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExtractLogGroup
    Properties:
      FunctionName: !Sub "binance-extract-bronze-${Environment}"
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: handler.lambda_handler
      Role: !GetAtt ExtractRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub "${CodePrefix}extract_bronze.zip"
      Environment:
        Variables:
          BUCKET_NAME: !Sub "binance-data-lake-${Environment}-${AWS::AccountId}"
          SYMBOL: BTCUSDT
          INTERVAL: 1d

  TransformSilverFunction:
    Type: AWS::Lambda::Function
    DependsOn: SilverLogGroup
    Properties:
      FunctionName: !Sub "binance-transform-silver-${Environment}"
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: handler.lambda_handler
      Role: !GetAtt SilverRole.Arn
      Timeout: 300
      MemorySize: 1024
      Layers: [!Ref PandasLayerArn]
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub "${CodePrefix}transform_silver.zip"
      Environment:
        Variables:
          BUCKET_NAME: !Sub "binance-data-lake-${Environment}-${AWS::AccountId}"
          SYMBOL: BTCUSDT

  SignalsGoldFunction:
    Type: AWS::Lambda::Function
    DependsOn: GoldLogGroup
    Properties:
      FunctionName: !Sub "binance-signals-gold-${Environment}"
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: handler.lambda_handler
      Role: !GetAtt GoldRole.Arn
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: !If
        - UsaConcurrenciaGold
        - !Ref GoldReservedConcurrency
        - !Ref "AWS::NoValue"
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub "${CodePrefix}signals_gold.zip"
      Environment:
        Variables:
          BUCKET_NAME: !Sub "binance-data-lake-${Environment}-${AWS::AccountId}"
          ATHENA_DATABASE: !Ref GlueDatabase
          SILVER_TABLE: binance_silver
          GOLD_TABLE: binance_gold_signals
          ATHENA_OUTPUT_LOCATION: !Sub "s3://binance-data-lake-${Environment}-${AWS::AccountId}/athena-results/"

  TransformSilverInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformSilverFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}"
  SignalsGoldInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SignalsGoldFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::binance-data-lake-${Environment}-${AWS::AccountId}"

  DailyIngestionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "binance-daily-ingestion-${Environment}"
      Description: Extrae la vela diaria cerrada de BTCUSDT a las 00:05 UTC.
      ScheduleExpression: "cron(5 0 * * ? *)"
      State: ENABLED
      Targets:
        - Id: ExtractBronzeTarget
          Arn: !GetAtt ExtractFunction.Arn
  ExtractSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExtractFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyIngestionRule.Arn

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "binance-alerts-${Environment}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  ExtractErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "binance-extract-errors-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ExtractFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  SilverErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "binance-silver-errors-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref TransformSilverFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  GoldErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "binance-gold-errors-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SignalsGoldFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  GoldThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UsaConcurrenciaGold
    Properties:
      AlarmName: !Sub "binance-gold-throttles-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref SignalsGoldFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "binance-monthly-${Environment}"
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  DataLakeBucketName:
    Value: !Ref DataLakeBucket
  AthenaDatabase:
    Value: !Ref GlueDatabase
  SilverTableName:
    Value: binance_silver
  GoldTableName:
    Value: binance_gold_signals
  GoldReadyPrefix:
    Value: control/gold-ready/